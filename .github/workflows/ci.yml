# The gates, on every pull request and on main: typecheck, the full Vitest suite (sharded), and the engine bundle.
# A pull request merges when the `ci` check is green. Benchmarks and sim:sweep stay out of CI.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: typecheck and bundle
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run build:engine

  test:
    name: test (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Three forks on the 4-core runner: with the local cap of six, worker RPC timed out under load.
      - run: pnpm run test -- --shard=${{ matrix.shard }}/3 --poolOptions.forks.maxForks=3

  # The single required check: green only when every job above is.
  ci:
    name: ci
    needs: [build, test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          test "${{ needs.build.result }}" = "success" && test "${{ needs.test.result }}" = "success"
